<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />

<body>
    <jm-layout>
        <div class="page contact-page">

            <section class="contact-hero">
                <h1 class="contact-hero-heading">
                    <jm-highlighted-text
                        heading
                        text="Let's connect."
                        highlight="connect"
                    ></jm-highlighted-text>
                </h1>
                <p class="contact-sub">
                    Whether you have a project in mind, want to collaborate, or just want to say hello — I'd love to hear from you.
                </p>
            </section>

            <jm-gradient-divider></jm-gradient-divider>

            <section class="contact-links-section">
                <jm-section-reveal>
                    <div class="contact-grid">
                        <a href="mailto:jamesmasher13@gmail.com" class="contact-card">
                            <span class="contact-icon">&#9993;</span>
                            <span class="contact-type">Email</span>
                            <span class="contact-value">jamesmasher13@gmail.com</span>
                        </a>
                        <a href="https://www.linkedin.com/in/james-macharia-b53963160/" target="_blank" rel="noopener" class="contact-card">
                            <span class="contact-icon">in</span>
                            <span class="contact-type">LinkedIn</span>
                            <span class="contact-value">Professional context</span>
                        </a>
                        <a href="https://github.com/MasherJames" target="_blank" rel="noopener" class="contact-card">
                            <span class="contact-icon">&#60;/&#62;</span>
                            <span class="contact-type">GitHub</span>
                            <span class="contact-value">Code context</span>
                        </a>
                        <a href="https://x.com/MasherJames" target="_blank" rel="noopener" class="contact-card">
                            <span class="contact-icon">&#120143;</span>
                            <span class="contact-type">X / Twitter</span>
                            <span class="contact-value">Thoughts & threads</span>
                        </a>
                    </div>
                </jm-section-reveal>
            </section>

        </div>
    </jm-layout>
</body>
</html>
